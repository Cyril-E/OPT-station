[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opt-station"
version = "0.24.1"
description = "OPT Station, lecteur-écrivain OpenPrintTag et inventaire de bobines"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "cbor2>=5.6,<6",
  "PyYAML>=6,<7",
  "segno>=1.6,<2",
  "Pillow>=11,<14",
  "pyserial>=3.5,<4",
  "mcp>=2.3,<3",
  "cryptography>=44,<51",
  "packaging>=24,<27",
  "jsonschema>=4.26,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1"]
camera = ["zxing-cpp>=3.1,<4"]
nfc = ["pyscard>=2.2,<3"]

[project.scripts]
opt-station = "openprinttag_app.__main__:main"
openprinttag-station = "openprinttag_app.__main__:main"

[tool.setuptools.packages.find]
include = ["openprinttag_app*"]

[tool.setuptools.package-data]
openprinttag_app = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
